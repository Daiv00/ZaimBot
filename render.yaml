services:
  - type: web
    name: loan-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: COMPANY_NAME
        value: Компания
      - key: COMPANY_INN
        value: ""
      - key: COMPANY_ADDRESS
        value: ""
      - key: WEBHOOK_SECRET
        generateValue: true
