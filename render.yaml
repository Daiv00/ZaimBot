services:
  - type: web
    name: loan-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: NOTIFY_CHAT_ID
        sync: false
      - key: COMPANY_NAME
        value: "Название организации"
      - key: COMPANY_INN
        value: ""
      - key: COMPANY_ADDRESS
        value: ""
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loan-telegram-db
          property: connectionString

databases:
  - name: loan-telegram-db
    databaseName: loanbot
    user: loanbot
